server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml model/gltf+json application/wasm;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Vite emits content-hashed files into assets/
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # .glb is not in the stock mime.types; woff2 is.
    location ~* \.glb$ {
        default_type model/gltf-binary;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri $uri/ /index.html;
    }
}
